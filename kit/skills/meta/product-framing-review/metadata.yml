name: product-framing-review
description: Frame unclear or drift-prone tasks and changes before planning or implementation, then clarify product purpose when end-user behavior, workflows, data meaning, or a PRD baseline is unclear.
category: meta
invocation: model
required: true
depends_on:
  - project-memory
version: 0.1.0
triggers:
  - frame a task or change
  - clarify scope and affected party
  - review product framing
  - clarify product purpose
  - repair a PRD or product baseline
