name: product-framing-review
description: Frame unclear or drift-prone tasks and changes before planning, implementation, or proposal review; reframe misaligned proposals and clarify product purpose when end-user behavior is affected.
category: meta
invocation: model
required: true
depends_on:
  - project-memory
version: 0.1.0
triggers:
  - frame a task or change
  - clarify scope and affected party
  - review plan or proposal framing
  - review product framing
  - clarify product purpose
  - repair a PRD or product baseline
