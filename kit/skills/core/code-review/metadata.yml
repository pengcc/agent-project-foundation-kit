# Code Review

Use this skill for review-only workflows before merge/apply or for staged plan-alignment review.

Primary targets:
- PR diff
- current local diff
- generated theme zip / package
- specific commit
- branch diff

Modes:
- Change Review
- Plan Alignment Review

Boundaries:
- Does not implement
- Does not approve, merge, apply, publish, release, or deploy
- Does not directly update project memory
